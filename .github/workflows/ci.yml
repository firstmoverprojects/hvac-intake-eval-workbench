name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Smoke-test the static server
        run: |
          npm start > /tmp/hvac-workbench-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in 1 2 3 4 5; do
            if curl --fail --silent --show-error http://127.0.0.1:8765/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent --show-error http://127.0.0.1:8765/data/demo-12.json > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8765/data/demo-3.jsonl > /dev/null
